<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare maps – Mapori</title>
<style>
:root{--bg:#f3e9d6;--ink:#2b2118;--ink2:#6b5a48;--accent:#b5452c;--card:#fbf5ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1424;--ink:#efe6d6;--ink2:#a99c8a;--accent:#f0a46a;--card:#171d31}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:64px 20px;text-align:center}
h1{font-family:"New York",Georgia,serif;font-weight:600;font-size:36px;line-height:1.2;margin:0 0 10px}
p{color:var(--ink2)} .n{font-family:"New York",Georgia,serif;font-size:72px;color:var(--accent);line-height:1}
a.btn{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
small{display:block;margin-top:28px;color:var(--ink2)}
</style></head><body><main>
<h1 id="title">A travel map for you</h1>
<div class="n" id="count"></div>
<p id="lead">Open it in Mapori to see where you’ve both been.</p>
<a class="btn" id="open" href="#">Open in Mapori</a>
<small>Don’t have Mapori yet? It’s free on the App Store – search for “Mapori”. Then tap this link again.<br>
The list of countries is in this link itself; this page sends nothing anywhere.</small>
</main>
<script>
// A térkép a # utáni részben van: a böngésző ezt nem küldi el a szervernek.
const q = new URLSearchParams(location.hash.slice(1));
const name = (q.get('n') || '').slice(0, 40);
const codes = [q.get('v'), q.get('l')].filter(Boolean).join('.').split('.').filter(c => /^[A-Z0-9]{2,3}$/.test(c));
if (name) document.getElementById('title').textContent = name + '’s travel map';
if (codes.length) document.getElementById('count').textContent = codes.length + (codes.length === 1 ? ' country' : ' countries');
const app = 'mapori://compare?' + location.hash.slice(1);
document.getElementById('open').href = app;
if (codes.length) setTimeout(() => { location.href = app; }, 400);
</script>
</body></html>
